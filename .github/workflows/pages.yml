name: Quality and Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages-ready: ${{ steps.pages-check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v5
      - name: Checkout approved Hair decoration source
        uses: actions/checkout@v5
        with:
          repository: ichAEY/Shablon-Hair-Master
          ref: d9ce7e2cd6fa16ad900fce2568b584cbc5a84481
          path: .tanem-source-hair
      - name: Prepare approved template assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/template
          cp .tanem-source-hair/public/assets/yulia/tools/hero.png public/assets/template/hair-tools.png
          rm -rf .tanem-source-hair
          test -s public/assets/template/hair-tools.png
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Render production scenarios
        run: npm run qa:scenarios
      - name: Add legacy GitHub Pages path without breaking custom domain
        shell: bash
        run: |
          set -euo pipefail
          test -s out/index.html
          root_copy="$RUNNER_TEMP/lyudmila-root"
          rm -rf "$root_copy"
          cp -a out "$root_copy"
          NEXT_PUBLIC_BASE_PATH=/lyudmila-nekora npm run build
          mkdir -p "$root_copy/lyudmila-nekora"
          cp -a out/. "$root_copy/lyudmila-nekora/"
          rm -rf out
          mv "$root_copy" out
          test -s out/index.html
          test -s out/lyudmila-nekora/index.html
          test -s out/assets/lyudmila/portfolio/galery00002.webp
          test -s out/lyudmila-nekora/assets/lyudmila/portfolio/galery00002.webp
      - name: Prepare GitHub Pages root fallback
        shell: bash
        run: |
          set -euo pipefail
          cp out/index.html out/404.html
          touch out/.nojekyll
      - id: pages-check
        name: Check whether Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - if: steps.pages-check.outputs.enabled != 'true'
        run: echo "::notice::Quality checks passed. Enable Settings → Pages → GitHub Actions to publish the preview."
      - if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.pages-ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
